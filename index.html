<!DOCTYPE html>
<html>
<head>
    <title>Background Color Changer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            transition: background 0.5s ease;
        }

        .container {
            background: rgb(44, 234, 51);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #b414ed;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #2b2697;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0537ff;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Background Color Changer</h1>
        

        <button onclick="changeColor()">
            Click Here
        </button>
    </div>

    <script>
        function changeColor() {
            const colors = [
                "#ff6b6b",
                "#4ecdc4",
                "#45b7d1",
                "#f7b731",
                "#a55eea",
                "#20bf6b",
                "#fd9644",
                "#2d98da"
            ];

            const randomColor =
                colors[Math.floor(Math.random() * colors.length)];

            document.body.style.background = randomColor;
        }
    </script>

</body>
</html>
